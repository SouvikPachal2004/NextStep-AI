services:
  # ── Backend (Node.js) ──────────────────────────────────────────────────────
  - type: web
    name: nextstep-ai-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false        # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false        # Set manually in Render dashboard
      - key: JWT_EXPIRE
        value: 7d
      - key: FRONTEND_URL
        sync: false        # Set after Netlify deploy
      - key: ML_SERVICE_URL
        sync: false        # Set after ML service deploy

  # ── ML Service (Python/Flask) ──────────────────────────────────────────────
  - type: web
    name: nextstep-ai-ml
    runtime: python
    rootDir: ml
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: python app.py
    envVars:
      - key: ML_PORT
        value: 5001
